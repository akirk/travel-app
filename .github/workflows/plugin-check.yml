name: Plugin Check

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: plugin-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: wordpress.org directory checks
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: travel-app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      # Check the tree that actually ships. git archive applies the
      # export-ignore rules from .gitattributes, so development-only files are
      # absent here exactly as they are in the release ZIP. Checking the working
      # copy instead reports .gitattributes and phpunit.xml.dist as errors that
      # no directory reviewer will ever see.
      - name: Build the release tree
        run: |
          mkdir -p "build/${PLUGIN_SLUG}"
          git archive HEAD | tar -x -C "build/${PLUGIN_SLUG}"

      - name: Install production dependencies
        if: hashFiles('build/travel-app/composer.json') != ''
        working-directory: build/travel-app
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/travel-app
