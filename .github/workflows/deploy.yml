name: Deploy to WordPress.org

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and diff against SVN without committing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to WP.org
    environment: production
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: travel-app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      # vendor/ is not committed, so what ships has to be built first. Building
      # from git archive lets .gitattributes export-ignore decide the contents,
      # which is the same rule the deploy action applies on its own.
      - name: Build the release tree
        run: |
          mkdir -p "build/${PLUGIN_SLUG}"
          git archive HEAD | tar -x -C "build/${PLUGIN_SLUG}"

      - name: Install production dependencies
        if: hashFiles('build/travel-app/composer.json') != ''
        working-directory: build/travel-app
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # Plugin files come from BUILD_DIR; the banner, icon and screenshots come
      # from ASSETS_DIR in the checkout, which defaults to .wordpress-org and is
      # export-ignored precisely so it stays out of the plugin ZIP.
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ inputs.dry-run || false }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: travel-app
          BUILD_DIR: build/travel-app
