<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f3ee">
    <title>Traveler — Timeline UI Concepts</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <!--
    THESIS: Four operational views expose how hierarchy—not decoration—changes travel planning; the gallery refuses four recolors of one card list.
    OWN-WORLD: Each concept owns a complete palette, typography, topology, control language, and responsive behavior while sharing one data source.
    STORY: Compare identical itinerary information, try the core editing flow, and identify which structure makes a trip easiest to operate.
    FIRST VIEWPORT: A compact comparison header leads directly into the selected full-width concept; concept tabs and primary actions stay visible.
    FORM: Four-direction comparison gallery; assigned direction Day Canvas; seed e4471cf8.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <a class="skip-link" href="#prototype-stage">Skip to selected concept</a>

    <header class="gallery-header">
        <div class="gallery-intro">
            <a class="traveler-mark" href="../../README.md" aria-label="Traveler project readme">
                <svg aria-hidden="true" viewBox="0 0 32 32"><path d="M5 17.5 26.5 6l-6.8 20-5.1-7.1L5 17.5Z"/><path d="m14.6 18.9 5.1-3.8"/></svg>
                <span>Traveler</span>
            </a>
            <div>
                <h1>Four ways to read a journey</h1>
                <p>Same trip. Same details. Four different planning instincts.</p>
            </div>
        </div>
        <div class="gallery-note" role="note">
            <span class="gallery-note-dot" aria-hidden="true"></span>
            Prototype only · edits reset on reload
        </div>
    </header>

    <nav class="concept-switcher" aria-label="Timeline concepts">
        <div class="concept-tabs" role="tablist" aria-label="Choose a concept">
            <button id="tab-ledger" class="concept-tab" type="button" role="tab" aria-selected="true" aria-controls="concept-ledger" data-concept-tab="ledger">
                <span>Command Ledger</span><small>Dense planning</small>
            </button>
            <button id="tab-atlas" class="concept-tab" type="button" role="tab" aria-selected="false" aria-controls="concept-atlas" data-concept-tab="atlas" tabindex="-1">
                <span>Route Atlas</span><small>Place & movement</small>
            </button>
            <button id="tab-canvas" class="concept-tab" type="button" role="tab" aria-selected="false" aria-controls="concept-canvas" data-concept-tab="canvas" tabindex="-1">
                <span>Day Canvas</span><small>Time & duration</small>
            </button>
            <button id="tab-pocket" class="concept-tab" type="button" role="tab" aria-selected="false" aria-controls="concept-pocket" data-concept-tab="pocket" tabindex="-1">
                <span>Pocket Briefing</span><small>One-handed focus</small>
            </button>
        </div>
    </nav>

    <main id="prototype-stage" class="prototype-stage">
        <section id="concept-ledger" class="concept concept-ledger" role="tabpanel" aria-labelledby="tab-ledger" data-concept="ledger"></section>
        <section id="concept-atlas" class="concept concept-atlas" role="tabpanel" aria-labelledby="tab-atlas" data-concept="atlas" hidden></section>
        <section id="concept-canvas" class="concept concept-canvas" role="tabpanel" aria-labelledby="tab-canvas" data-concept="canvas" hidden></section>
        <section id="concept-pocket" class="concept concept-pocket" role="tabpanel" aria-labelledby="tab-pocket" data-concept="pocket" hidden></section>
    </main>

    <aside class="editor-drawer" data-editor aria-labelledby="editor-title" aria-hidden="true">
        <div class="editor-backdrop" data-editor-close></div>
        <div class="editor-sheet" role="dialog" aria-modal="true" aria-describedby="editor-description">
            <header class="editor-header">
                <div>
                    <p id="editor-description">Prototype changes are kept only in this browser session.</p>
                    <h2 id="editor-title">Edit itinerary item</h2>
                </div>
                <button class="icon-button" type="button" data-editor-close aria-label="Close editor">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
                </button>
            </header>
            <form class="editor-form" data-editor-form>
                <input type="hidden" name="id">
                <label class="field field-wide">Title<input name="title" required autocomplete="off"></label>
                <label class="field">Type<select name="type"><option value="flight">Flight</option><option value="lodging">Lodging</option><option value="train">Train</option><option value="car">Rental car</option><option value="activity">Activity</option><option value="other">Other</option></select></label>
                <label class="field">Date<input name="date" type="date" min="2026-06-12" max="2026-06-17" required><small>Choose a date within this trip.</small></label>
                <label class="field">Starts<input name="time" type="time"></label>
                <label class="field">Ends<input name="endTime" type="time"></label>
                <label class="field field-wide">Location<input name="location" autocomplete="off"></label>
                <label class="field field-wide">Destination<input name="endLocation" autocomplete="off"></label>
                <label class="field field-wide">Notes<textarea name="details" rows="4"></textarea></label>
                <div class="editor-actions field-wide">
                    <button class="button-secondary" type="button" data-editor-close>Cancel</button>
                    <button class="button-primary" type="submit"><span data-save-label>Save item</span></button>
                </div>
            </form>
        </div>
    </aside>

    <div class="toast" role="status" aria-live="polite" aria-atomic="true" data-toast></div>
</body>
</html>
